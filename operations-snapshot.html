<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HFCU Operations Snapshot</title>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0} body{font-family:'DM Sans',sans-serif;background:#f1f5f9;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px}.card{background:white;border-radius:16px;overflow:hidden;box-shadow:0 4px 24px rgba(26,39,68,0.10);width:100%;max-width:900px;border:1px solid #e2e8f0}.header{background:linear-gradient(135deg,#0f1a2e 0%,#1a2744 55%,#2d3f6b 100%);padding:28px 32px;display:flex;align-items:center;justify-content:space-between;gap:20px;flex-wrap:wrap}.header-text h1{font-family:'Source Serif 4',serif;font-size:22px;font-weight:700;color:white;line-height:1.1}.header-text p{font-size:11px;font-weight:600;color:rgba(184,151,90,0.85);text-transform:uppercase;letter-spacing:0.14em;margin-top:4px}.open-btn{display:inline-flex;align-items:center;gap:8px;padding:12px 22px;background:linear-gradient(135deg,#b8975a,#cdb07a);color:#0f1a2e;font-size:13px;font-weight:700;border:none;border-radius:10px;cursor:pointer;text-decoration:none;white-space:nowrap}.health{padding:14px 32px;display:flex;align-items:center;gap:10px;border-bottom:1px solid #e2e8f0}.health.ok{background:#f0fdf4}.health.warn{background:#fffbeb}.health.crit{background:#fef2f2}.health-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}.health.ok .health-dot{background:#16a34a}.health.warn .health-dot{background:#b45309}.health.crit .health-dot{background:#dc2626}.health-text{font-size:13px;font-weight:600}.health.ok .health-text{color:#166534}.health.warn .health-text{color:#b45309}.health.crit .health-text{color:#dc2626}.health-sub{font-size:11px;color:#94a3b8;margin-left:auto}.systems-wrap{padding:20px 32px 24px}.systems-label{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:0.14em;color:#94a3b8;margin-bottom:12px}.systems-grid{display:flex;flex-wrap:wrap;gap:6px}.sys-pill{display:inline-flex;align-items:center;gap:5px;padding:5px 11px;border-radius:20px;font-size:11px;font-weight:500;border:1px solid}.sys-pill.op{background:#f0fdf4;border-color:#86efac;color:#166534}.sys-pill.deg{background:#fffbeb;border-color:#fde68a;color:#b45309}.sys-pill.maint{background:#eff6ff;border-color:#93c5fd;color:#1d4ed8}.sys-pill.out{background:#fef2f2;border-color:#fecaca;color:#dc2626}.sys-dot{width:6px;height:6px;border-radius:50%;flex-shrink:0}.sys-pill.op .sys-dot{background:#16a34a}.sys-pill.deg .sys-dot{background:#b45309}.sys-pill.maint .sys-dot{background:#1d4ed8}.sys-pill.out .sys-dot{background:#dc2626}.footer{background:#f8fafc;border-top:1px solid #e2e8f0;padding:12px 32px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}.footer-counts{display:flex;gap:16px;flex-wrap:wrap}.count-item{font-size:12px;color:#475569}.count-item strong{color:#1a2744;font-weight:700}.loading{padding:32px;text-align:center;color:#94a3b8;font-size:13px}.error-state{padding:20px 32px;color:#dc2626;font-size:13px;background:#fef2f2}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
<div class="card"><div class="header"><div class="header-text"><h1>Operations Dashboard</h1><p>Heritage Financial Credit Union</p></div><a href="./admin.html" target="_blank" class="open-btn">Open Full Dashboard</a></div><div id="content"><div class="loading">Loading system status...</div></div></div>
<script>
const sb = supabase.createClient('https://tqshcfqxypyppaykwdaf.supabase.co','eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRxc2hjZnF4eXB5cHBheWt3ZGFmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzM2NjY1MzYsImV4cCI6MjA4OTI0MjUzNn0.h7_C_oXZ6eKzbnMrInWqbJ635m-eQvD4zZzUVPQuxZs');
function safeArr(res){ return res && res.data ? res.data : []; }
async function loadStatus(){ try { const [sysRes, impactRes, maintRes] = await Promise.all([sb.from('systems').select('*').order('name'), sb.from('service_impacts').select('*').neq('status','Resolved').neq('status','Closed').order('updated_at',{ascending:false}), sb.from('maintenance').select('*').neq('status','Complete').order('updated_at',{ascending:false})]); const systems=safeArr(sysRes), impacts=safeArr(impactRes), maints=safeArr(maintRes); const statusMap={}; systems.forEach(s=>statusMap[s.name]={...s,derivedStatus:'op'}); impacts.forEach(item=>{const sys=item.system;if(!sys)return; const match=Object.keys(statusMap).find(k=>k.toLowerCase().includes(sys.toLowerCase())||sys.toLowerCase().includes(k.toLowerCase()))||sys; if(!statusMap[match])statusMap[match]={name:match,status:'Active',note:'',icon:'',derivedStatus:'op'}; const sev=item.severity||'Medium'; const cur=statusMap[match].derivedStatus||'op'; if(sev==='Critical'&&cur!=='out'){statusMap[match].derivedStatus='out';statusMap[match].note=item.title}else if((sev==='High'||sev==='Medium')&&cur==='op'){statusMap[match].derivedStatus='deg';statusMap[match].note=item.title}}); maints.forEach(m=>{const key=Object.keys(statusMap).find(k=>k.toLowerCase().includes((m.system||'').toLowerCase())||(m.system||'').toLowerCase().includes(k.toLowerCase())); if(key&&statusMap[key].derivedStatus==='op'){statusMap[key].derivedStatus='maint';statusMap[key].note=m.title}}); const sysList=Object.values(statusMap).sort((a,b)=>a.name.localeCompare(b.name)); const hasCrit=sysList.some(s=>s.derivedStatus==='out'); const hasWarn=sysList.some(s=>s.derivedStatus==='deg'||s.derivedStatus==='maint'); const healthClass=hasCrit?'crit':hasWarn?'warn':'ok'; const outageCount=sysList.filter(s=>s.derivedStatus==='out').length; const impactedCount=sysList.filter(s=>s.derivedStatus!=='op').length; const healthText=hasCrit?`${outageCount} System Outage${outageCount!==1?'s':''}`:hasWarn?`${impactedCount} System${impactedCount!==1?'s':''} Impacted`:'All Systems Operational'; const pills=sysList.map(s=>{const st=s.derivedStatus||'op'; const icon=s.icon?`${s.icon} `:''; return `<div class="sys-pill ${st}" title="${(s.note||'').replace(/"/g,'&quot;')}"><div class="sys-dot"></div>${icon}${s.name}</div>`}).join(''); const now=new Date().toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'}); document.getElementById('content').innerHTML=`<div class="health ${healthClass}"><div class="health-dot"></div><div class="health-text">${healthText}</div><div class="health-sub">Updated ${now}</div></div><div class="systems-wrap"><div class="systems-label">System Status</div><div class="systems-grid">${pills||'<div class="error-state">No systems found.</div>'}</div></div><div class="footer"><div class="footer-counts"><div class="count-item"><strong>${impacts.length}</strong> Active Service Impact${impacts.length!==1?'s':''}</div><div class="count-item"><strong>${maints.length}</strong> Maintenance Window${maints.length!==1?'s':''}</div><div class="count-item"><strong>${sysList.filter(s=>s.derivedStatus==='op').length}/${sysList.length}</strong> Systems Operational</div></div><a href="./admin.html" target="_blank" style="font-size:12px;color:#b8975a;font-weight:600;text-decoration:none;">View full dashboard →</a></div>` } catch(e){console.error(e); document.getElementById('content').innerHTML='<div class="error-state">Could not load status.</div>'}}
loadStatus(); setInterval(loadStatus,60000);
</script>
</body>
</html>
