<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HFCU Mission Control</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root{
      --navy:#172a53;
      --navy-2:#1f3868;
      --gold:#c6a257;
      --bg:#f4f6fa;
      --card:#ffffff;
      --border:#d9e2ec;
      --text:#17233a;
      --muted:#72839a;
      --green:#22a25a;
      --green-bg:#eefaf2;
      --orange:#cc5b18;
      --orange-bg:#fff2e8;
      --blue:#2f6fe4;
      --blue-bg:#eef5ff;
      --purple:#7c3aed;
      --purple-bg:#f4efff;
      --shadow:0 10px 28px rgba(23,42,83,.08);
      --radius:18px;
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      font-family:Arial,Helvetica,sans-serif;
      background:var(--bg);
      color:var(--text);
    }
    .app{
      display:grid;
      grid-template-columns:240px 1fr;
      min-height:100vh;
    }
    .sidebar{
      background:var(--navy);
      color:#fff;
      padding:18px 16px;
      display:flex;
      flex-direction:column;
    }
    .logo-wrap{
      margin-bottom:18px;
    }
    .logo{
      width:170px;
      max-width:100%;
      height:auto;
      display:block;
    }
    .brand-fallback{
      font-size:26px;
      font-weight:700;
      letter-spacing:.02em;
    }
    .tag{
      margin-top:8px;
      font-size:11px;
      text-transform:uppercase;
      letter-spacing:.18em;
      color:#c6a257;
    }
    .nav{
      margin-top:12px;
      display:flex;
      flex-direction:column;
      gap:8px;
    }
    .nav button{
      border:none;
      background:transparent;
      color:#fff;
      text-align:left;
      padding:12px 14px;
      border-radius:12px;
      cursor:pointer;
      font-size:15px;
    }
    .nav button.active,
    .nav button:hover{
      background:rgba(255,255,255,.1);
      box-shadow:inset 0 0 0 1px rgba(255,255,255,.08);
    }
    .sidebar-foot{
      margin-top:auto;
      padding-top:16px;
      font-size:12px;
      color:rgba(255,255,255,.75);
    }
    .main{
      padding:22px;
    }
    .topbar{
      display:flex;
      justify-content:space-between;
      align-items:flex-start;
      gap:16px;
      flex-wrap:wrap;
      margin-bottom:20px;
    }
    .title{
      font-size:28px;
      font-weight:700;
      color:var(--navy);
      margin:0;
    }
    .subtitle{
      margin-top:4px;
      color:var(--muted);
      font-size:14px;
    }
    .actions{
      display:flex;
      gap:10px;
      flex-wrap:wrap;
    }
    .btn{
      border:none;
      border-radius:12px;
      padding:11px 14px;
      font-weight:700;
      cursor:pointer;
    }
    .btn-gold{background:var(--gold);color:#fff}
    .btn-light{background:#fff;color:var(--navy);border:1px solid var(--border)}
    .card{
      background:var(--card);
      border:1px solid var(--border);
      border-radius:var(--radius);
      box-shadow:var(--shadow);
    }
    .section-head{
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:12px;
      padding:14px 18px;
      border-bottom:1px solid #edf2f7;
    }
    .section-label{
      font-size:13px;
      font-weight:700;
      letter-spacing:.12em;
      text-transform:uppercase;
      color:#c77726;
    }
    .section-link{
      background:#fff;
      border:1px solid var(--border);
      border-radius:10px;
      padding:8px 12px;
      cursor:pointer;
      color:var(--navy);
      font-weight:700;
    }
    .live-body{
      padding:16px 18px;
    }
    .health{
      border:2px solid #9ad8b0;
      background:var(--green-bg);
      color:#16653b;
      border-radius:14px;
      padding:12px 14px;
      font-weight:700;
      margin-bottom:12px;
    }
    .pill-wrap{
      display:flex;
      flex-wrap:wrap;
      gap:8px;
    }
    .pill{
      display:inline-flex;
      align-items:center;
      gap:8px;
      padding:8px 12px;
      border-radius:999px;
      background:var(--green-bg);
      color:#165f37;
      border:1px solid #9ed8b2;
      font-size:13px;
    }
    .pill .dot{
      width:9px;
      height:9px;
      border-radius:50%;
      background:var(--green);
    }
    .stats{
      display:grid;
      grid-template-columns:repeat(4,1fr);
      gap:14px;
      margin:18px 0;
    }
    .stat{
      padding:16px 18px;
      border-top:4px solid var(--gold);
    }
    .stat.orange{border-top-color:var(--orange)}
    .stat.blue{border-top-color:var(--blue)}
    .stat.navy{border-top-color:var(--navy-2)}
    .stat.gold{border-top-color:var(--gold)}
    .stat .num{
      font-size:34px;
      font-weight:700;
      color:var(--navy);
      line-height:1;
    }
    .stat .label{
      margin-top:8px;
      color:#8192a8;
      font-size:13px;
    }
    .quick{
      padding:16px 18px;
      margin-bottom:18px;
    }
    .cap{
      font-size:13px;
      font-weight:700;
      letter-spacing:.12em;
      text-transform:uppercase;
      color:#96a6bc;
      margin-bottom:12px;
    }
    .quick-grid{
      display:grid;
      grid-template-columns:repeat(5,1fr);
      gap:10px;
    }
    .qbtn{
      border-radius:14px;
      border:1px solid var(--border);
      padding:16px 12px;
      background:#fff;
      cursor:pointer;
      font-weight:700;
      color:var(--navy);
      text-align:center;
    }
    .qbtn .ico{
      display:block;
      font-size:18px;
      margin-bottom:8px;
    }
    .qbtn.orange{background:var(--orange-bg);border-color:#f0c3a4;color:var(--orange)}
    .qbtn.blue{background:var(--blue-bg);border-color:#bfd5ff;color:#255fcb}
    .qbtn.gold{background:#f8f1e4;border-color:#ead3ad;color:#8d6110}
    .qbtn.green{background:var(--green-bg);border-color:#a9dfbf;color:#1e8a4f}
    .qbtn.purple{background:var(--purple-bg);border-color:#d7c8ff;color:#6a30d7}
    .queues{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:14px;
    }
    .items{
      min-height:120px;
    }
    .item{
      padding:14px 16px;
      border-top:1px solid #edf2f7;
    }
    .item:first-child{border-top:none}
    .item-title{
      font-weight:700;
      color:var(--navy);
    }
    .meta{
      display:flex;
      flex-wrap:wrap;
      gap:8px;
      margin-top:6px;
      font-size:12px;
      color:var(--muted);
    }
    .body-text{
      margin-top:10px;
      line-height:1.45;
      color:#29405a;
    }
    .badge{
      display:inline-flex;
      align-items:center;
      padding:5px 9px;
      border-radius:999px;
      font-size:11px;
      font-weight:700;
      border:1px solid #d7e1eb;
      background:#f5f8fb;
      color:#3b5773;
    }
    .sev-critical{background:#fde8e8;border-color:#f3c1c1;color:#8d1c1c}
    .sev-high{background:#fff1e2;border-color:#f1d2b0;color:#9b540e}
    .sev-medium{background:#eef5ff;border-color:#cbdcff;color:#2357b6}
    .sev-low{background:#edf9f2;border-color:#b9e2cb;color:#1b7a46}
    .view{display:none}
    .view.active{display:block}
    .view-title{
      font-size:28px;
      font-weight:700;
      color:var(--navy);
      margin:0;
    }
    .view-sub{
      margin-top:4px;
      color:var(--muted);
      font-size:14px;
    }
    .view-head{
      display:flex;
      justify-content:space-between;
      align-items:flex-start;
      gap:12px;
      flex-wrap:wrap;
      margin-bottom:14px;
    }
    .toolbar{
      display:flex;
      gap:10px;
      flex-wrap:wrap;
      margin-bottom:14px;
    }
    .search{
      width:100%;
      max-width:360px;
      border:1px solid var(--border);
      border-radius:12px;
      padding:11px 12px;
      background:#fff;
    }
    .systems-grid{
      display:grid;
      grid-template-columns:repeat(3,1fr);
      gap:14px;
    }
    .system-card{
      padding:16px;
    }
    .system-top{
      display:flex;
      justify-content:space-between;
      gap:8px;
      align-items:flex-start;
    }
    .system-name{
      font-weight:700;
      color:var(--navy);
      font-size:16px;
    }
    .system-icon{
      font-size:22px;
      margin-right:10px;
    }
    .system-note{
      margin-top:10px;
      color:#51657d;
      font-size:13px;
      line-height:1.42;
      min-height:36px;
    }
    .system-actions{
      display:flex;
      flex-wrap:wrap;
      gap:8px;
      margin-top:12px;
    }
    .system-actions button{
      border:1px solid var(--border);
      background:#fff;
      color:var(--navy);
      border-radius:10px;
      padding:8px 10px;
      cursor:pointer;
      font-weight:700;
    }
    .empty{
      padding:18px;
      text-align:center;
      color:#98a8bc;
    }
    .modal{
      position:fixed;
      inset:0;
      background:rgba(10,20,40,.45);
      display:none;
      align-items:center;
      justify-content:center;
      padding:18px;
      z-index:2000;
    }
    .modal.open{display:flex}
    .modal-card{
      width:min(920px,100%);
      background:#fff;
      border-radius:20px;
      overflow:hidden;
      box-shadow:0 30px 70px rgba(23,42,83,.26);
    }
    .modal-head{
      background:var(--navy);
      color:#fff;
      padding:16px 18px;
      display:flex;
      justify-content:space-between;
      align-items:center;
    }
    .modal-title{
      font-size:22px;
      font-weight:700;
    }
    .modal-body{padding:18px}
    .form-grid{
      display:grid;
      grid-template-columns:repeat(2,minmax(0,1fr));
      gap:14px;
    }
    .field{
      display:flex;
      flex-direction:column;
      gap:6px;
    }
    .field.full{grid-column:1/-1}
    label{
      font-size:13px;
      font-weight:700;
      color:var(--navy);
    }
    input,select,textarea{
      width:100%;
      border:1px solid var(--border);
      border-radius:12px;
      padding:11px 12px;
      font:inherit;
      background:#fff;
      color:var(--text);
    }
    textarea{
      min-height:110px;
      resize:vertical;
    }
    .modal-foot{
      padding:0 18px 18px;
      display:flex;
      justify-content:flex-end;
      gap:10px;
      flex-wrap:wrap;
    }
    @media (max-width:1100px){
      .stats{grid-template-columns:repeat(2,1fr)}
      .systems-grid{grid-template-columns:repeat(2,1fr)}
      .quick-grid{grid-template-columns:repeat(3,1fr)}
    }
    @media (max-width:860px){
      .app{grid-template-columns:1fr}
      .sidebar{display:none}
      .queues{grid-template-columns:1fr}
      .systems-grid{grid-template-columns:1fr}
    }
    @media (max-width:640px){
      .main{padding:16px}
      .stats{grid-template-columns:1fr}
      .quick-grid{grid-template-columns:repeat(2,1fr)}
      .form-grid{grid-template-columns:1fr}
    }
  </style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="logo-wrap">
      <img src="./logo-white.png" class="logo" onerror="this.style.display='none';document.getElementById('brandFallback').style.display='block';">
      <div id="brandFallback" class="brand-fallback" style="display:none;">HERITAGE</div>
      <div class="tag">Mission Control</div>
    </div>

    <div class="nav" id="nav"></div>

    <div class="sidebar-foot">
      <div><strong>Operations Admin</strong></div>
      <div>Administrator</div>
    </div>
  </aside>

  <main class="main">
    <div class="topbar">
      <div>
        <h1 class="title" id="pageTitle">Mission Control</h1>
        <div class="subtitle" id="pageSub">Live operational summary</div>
      </div>
      <div class="actions">
        <button class="btn btn-gold" onclick="setView('snapshot')">↗ View Snapshot</button>
      </div>
    </div>

    <section id="view-snapshot" class="view active"></section>
    <section id="view-systems" class="view"></section>
    <section id="view-service-impacts" class="view"></section>
    <section id="view-maintenance" class="view"></section>
    <section id="view-enhancements" class="view"></section>
    <section id="view-releases" class="view"></section>
    <section id="view-settings" class="view"></section>
  </main>
</div>

<div class="modal" id="modal">
  <div class="modal-card">
    <div class="modal-head">
      <div class="modal-title" id="modalTitle">Edit</div>
      <button class="btn btn-light" type="button" onclick="closeModal()">Close</button>
    </div>
    <div class="modal-body">
      <form id="entityForm">
        <input type="hidden" id="entityType">
        <input type="hidden" id="entityId">
        <div class="form-grid" id="formFields"></div>
      </form>
    </div>
    <div class="modal-foot">
      <button class="btn btn-light" id="deleteBtn" type="button" onclick="deleteEntity()">Delete</button>
      <button class="btn btn-gold" type="button" onclick="saveEntity()">Save</button>
    </div>
  </div>
</div>

<script>
const SUPABASE_URL = "https://tqshcfqxypyppaykwdaf.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRxc2hjZnF4eXB5cHBheWt3ZGFmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzM2NjY1MzYsImV4cCI6MjA4OTI0MjUzNn0.h7_C_oXZ6eKzbnMrInWqbJ635m-eQvD4zZzUVPQuxZs";

const sb = sb.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const NAV = [
  { id:"snapshot", label:"Dashboard", icon:"◈" },
  { id:"systems", label:"Systems", icon:"⬡" },
  { id:"service-impacts", label:"Service Impacts", icon:"⚠" },
  { id:"maintenance", label:"Maintenance", icon:"🔧" },
  { id:"enhancements", label:"Enhancements", icon:"✦" },
  { id:"releases", label:"Releases & Roadmap", icon:"✧" },
  { id:"settings", label:"Settings", icon:"⚙" }
];

const SYSTEM_ICON_FALLBACKS = {
  "Asana (Project/Task Management)":"⚡",
  "ATM Network":"🏧",
  "Encompass (Mortgage LOS)":"🏠",
  "Ensenta (Mobile RDC)":"📲",
  "Enterprise / Multi-System":"✧",
  "Fiserv CardHub (Card Controls)":"💳",
  "Fiserv EFT (Debit Card Services)":"💸",
  "Fiserv Prologue (General Ledger)":"🧾",
  "iBanking (Online Banking)":"🌐",
  "iDashboards (Reporting)":"📊",
  "Identifi (Document Management)":"📁",
  "iMobile (Mobile Banking)":"📱",
  "INSIGHT / COCC Core":"🏦",
  "Interface AI (HOPE Phone Banking)":"🤖",
  "SimplifyIT (Intranet)":"🖥️",
  "Temenos Loan Platform":"🏛️",
  "Zoom (Contact Center)":"💬"
};

const DB = {
  systems: [],
  service_impacts: [],
  maintenance: [],
  enhancements: [],
  releases: []
};

let currentView = "snapshot";
let searchTerms = {
  systems:"",
  impacts:"",
  maintenance:"",
  enhancements:"",
  releases:""
};

const impactTypes = ["Outage","Degraded Performance","Feature Failure","Vendor Issue","Operational Disruption","Security Review","Fraud Review","Member Communication Only","Scheduled Maintenance Overrun"];
const severities = ["Critical","High","Medium","Low"];
const impactStatuses = ["Investigating","Identified","Monitoring","Resolved","Closed"];
const audiences = ["Members","Staff","Both"];
const maintenanceStatuses = ["Planned","Active","Monitoring","Complete"];
const releaseStatuses = ["Planned","In Progress","Complete","Archived"];
const enhancementStages = ["Intake","Review","Approved","Planned","In Progress","Complete","Archived"];

function uid(prefix="id"){
  return `${prefix}_${Math.random().toString(36).slice(2,10)}`;
}
function esc(v){
  return String(v ?? "").replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}
function fmtDate(v){
  if(!v) return "Not set";
  try { return new Date(v).toLocaleString(); } catch { return v; }
}
function isoLocal(v){
  if(!v) return "";
  const d = new Date(v);
  if(Number.isNaN(d.getTime())) return "";
  const p = n => String(n).padStart(2,"0");
  return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}T${p(d.getHours())}:${p(d.getMinutes())}`;
}
function isActive(item){
  return !(item && item.deactivate_at && new Date(item.deactivate_at) <= new Date());
}
function sevRank(v){
  return {Critical:1,High:2,Medium:3,Low:4}[v] || 99;
}
function statusRank(v){
  return {Investigating:1,Identified:2,Monitoring:3,Resolved:4,Closed:5}[v] || 99;
}
function byUpdatedDesc(a,b){
  return new Date(b.updated_at || b.created_at || 0) - new Date(a.updated_at || a.created_at || 0);
}
function sortImpacts(items){
  return [...items].sort((a,b) => sevRank(a.severity) - sevRank(b.severity) || statusRank(a.status) - statusRank(b.status) || byUpdatedDesc(a,b));
}
function badge(v){
  return `<span class="badge">${esc(v || "Unknown")}</span>`;
}
function badgeSeverity(v){
  return `<span class="badge sev-${String(v || "").toLowerCase()}">${esc(v || "Unknown")}</span>`;
}
function systemIcon(name, icon){
  return esc(icon || SYSTEM_ICON_FALLBACKS[name] || "⬡");
}
function filterBy(key, item, fields){
  const q = (searchTerms[key] || "").trim().toLowerCase();
  if(!q) return true;
  return fields.some(f => String(item[f] || "").toLowerCase().includes(q));
}

function renderNav(){
  document.getElementById("nav").innerHTML = NAV.map(n => `
    <button class="${currentView === n.id ? "active" : ""}" onclick="setView('${n.id}')">${n.icon} ${n.label}</button>
  `).join("");
}

window.setView = function(id){
  currentView = id;
  renderNav();
  document.querySelectorAll(".view").forEach(v => v.classList.remove("active"));
  document.getElementById(`view-${id}`).classList.add("active");

  const titleMap = {
    snapshot:"Mission Control",
    systems:"Systems",
    "service-impacts":"Service Impacts",
    maintenance:"Maintenance",
    enhancements:"Enhancements",
    releases:"Releases & Roadmap",
    settings:"Settings"
  };
  const subMap = {
    snapshot:"Live operational summary",
    systems:"System inventory and quick actions",
    "service-impacts":"Active and historical service events",
    maintenance:"Planned and active maintenance work",
    enhancements:"Improvement pipeline",
    releases:"Delivery and release tracking",
    settings:"Deployment notes"
  };
  document.getElementById("pageTitle").textContent = titleMap[id];
  document.getElementById("pageSub").textContent = subMap[id];
};

async function loadTable(table, orderCol="updated_at", ascending=false){
  const { data, error } = await sb.from(table).select("*").order(orderCol,{ ascending });
  if(error){
    console.error(table, error);
    return [];
  }
  return data || [];
}

async function loadData(){
  const [systems, impacts, maintenance, enhancements, releases] = await Promise.all([
    loadTable("systems","name",true),
    loadTable("service_impacts"),
    loadTable("maintenance"),
    loadTable("enhancements"),
    loadTable("releases")
  ]);
  DB.systems = systems;
  DB.service_impacts = impacts;
  DB.maintenance = maintenance;
  DB.enhancements = enhancements;
  DB.releases = releases;
  renderAll();
}

function counts(){
  return {
    impacts: DB.service_impacts.filter(x => isActive(x) && !["Resolved","Closed"].includes(x.status)).length,
    maintenance: DB.maintenance.filter(x => isActive(x) && x.status !== "Complete").length,
    enhancements: DB.enhancements.filter(x => isActive(x) && !["Archived","Complete"].includes(x.stage)).length,
    releases: DB.releases.filter(x => isActive(x) && x.status !== "Archived").length
  };
}

function renderAll(){
  renderNav();
  renderSnapshot();
  renderSystems();
  renderServiceImpacts();
  renderMaintenance();
  renderEnhancements();
  renderReleases();
  renderSettings();
  setView(currentView);
}

function renderSnapshot(){
  const c = counts();
  const activeSystems = DB.systems.filter(s => (s.status || "Active") === "Active");
  const impacts = sortImpacts(DB.service_impacts.filter(x => isActive(x) && !["Resolved","Closed"].includes(x.status))).slice(0,4);
  const maintenance = [...DB.maintenance.filter(x => isActive(x) && x.status !== "Complete")].sort(byUpdatedDesc).slice(0,4);

  document.getElementById("view-snapshot").innerHTML = `
    <div class="card">
      <div class="section-head">
        <div class="section-label">Live Snapshot Preview</div>
        <button class="section-link" onclick="window.open('./operations-snapshot.html','_blank')">Open full view ↗</button>
      </div>
      <div class="live-body">
        <div class="health">${c.impacts === 0 ? "● All systems operational" : "● Active service impacts in progress"}</div>
        <div class="pill-wrap">
          ${activeSystems.map(s => `
            <div class="pill">
              <span class="dot"></span>
              <span>${systemIcon(s.name,s.icon)}</span>
              <span>${esc(s.name)}</span>
            </div>
          `).join("") || `<div class="empty">No active systems found.</div>`}
        </div>
      </div>
    </div>

    <div class="stats">
      <div class="card stat orange">
        <div class="num">${c.impacts}</div>
        <div class="label">Active Service Impacts</div>

      { name:"severity", label:"Severity", type:"select", required:true, options:severities.map(v => ({ value:v, label:v })) },
      { name:"status", label:"Status", type:"select", required:true, options:impactStatuses.map(v => ({ value:v, label:v })) },
      { name:"owner", label:"Owner", type:"text" },
      { name:"audience", label:"Audience", type:"select", required:true, options:audiences.map(v => ({ value:v, label:v })) },
      { name:"publish_externally", label:"Publish External Notice", type:"checkbox" },
      { name:"started_at", label:"Started At", type:"datetime-local" },
      { name:"deactivate_at", label:"Deactivate On", type:"datetime-local" },
      { name:"member_impact", label:"Member Impact", type:"textarea", required:true, full:true },
      { name:"internal_impact", label:"Internal Impact", type:"textarea", full:true },
      { name:"summary", label:"Summary", type:"textarea", full:true },
      { name:"source_type", label:"Source Type", type:"select", options:["Manual Summary","Zoom Meeting Summary","Vendor Email","Internal Email Thread","Call Notes"].map(v => ({ value:v, label:v })) },
      { name:"source_detail", label:"Source Detail", type:"textarea", full:true }
    ];

  if(type === "maintenance"){
    return [
      { name:"system", label:"System", type:"select", required:true, options:DB.systems.map(s => ({ value:s.name, label:s.name })) },
      { name:"title", label:"Title", type:"text", required:true },

      { name:"impact", label:"Impact", type:"textarea", full:true }

window.openEditor = function(type, id=null, defaultSystem=""){
  const row = id ? (DB[type] || []).find(x => x.id === id) : null;
  document.getElementById("entityType").value = type;
  document.getElementById("entityId").value = row?.id || "";
  document.getElementById("modalTitle").textContent = `${row ? "Edit" : "New"} ${type.replace("_"," ").replace(/\b\w/g,m => m.toUpperCase())}`;
  document.getElementById("deleteBtn").style.display = row ? "inline-flex" : "none";

  const fields = schemaFor(type);
  document.getElementById("formFields").innerHTML = fields.map(f => {
    let val = row ? row[f.name] : (f.name === "system" ? defaultSystem : "");
    if(f.type === "textarea"){
      return `
        <div class="field ${f.full ? "full" : ""}">
          <label>${f.label}${f.required ? " *" : ""}</label>
          <textarea id="f_${f.name}">${esc(val)}</textarea>
        </div>
      `;
    }
    if(f.type === "select"){
      return `
        <div class="field ${f.full ? "full" : ""}">
          <label>${f.label}${f.required ? " *" : ""}</label>
          <select id="f_${f.name}">
            <option value="">Select...</option>
            ${f.options.map(o => `<option value="${esc(o.value)}" ${String(val || "") === String(o.value) ? "selected" : ""}>${esc(o.label)}</option>`).join("")}
          </select>
        </div>
      `;
    }
    if(f.type === "checkbox"){
      return `
        <div class="field">
          <label>${f.label}</label>
          <select id="f_${f.name}">
            <option value="false" ${val ? "" : "selected"}>No</option>
            <option value="true" ${val ? "selected" : ""}>Yes</option>
          </select>
        </div>
      `;
    }
    if(f.type === "datetime-local") val = isoLocal(val);
    return `
      <div class="field ${f.full ? "full" : ""}">
        <label>${f.label}${f.required ? " *" : ""}</label>
        <input id="f_${f.name}" type="${f.type}" value="${esc(val)}">
      </div>
    `;
  }).join("");

  document.getElementById("modal").classList.add("open");
};

window.closeModal = function(){
  document.getElementById("modal").classList.remove("open");
};

async function saveEntity(){
  const type = document.getElementById("entityType").value;
  const existingId = document.getElementById("entityId").value;
  const id = existingId || uid(type.slice(0,4));
  const payload = { id };

  for(const f of schemaFor(type)){
    let value = document.getElementById(`f_${f.name}`).value;
    if(f.type === "checkbox") value = value === "true";
    if(f.type === "datetime-local" && value) value = new Date(value).toISOString();
    if(f.required && (value === "" || value == null)){
      alert(`${f.label} is required.`);
      return;
    }
    payload[f.name] = value === "" ? null : value;
  }

  const now = new Date().toISOString();
  payload.updated_at = now;
  if(!existingId) payload.created_at = now;
  if(type === "service_impacts" && !payload.started_at) payload.started_at = now;
  if(type === "service_impacts" && ["Resolved","Closed"].includes(payload.status)) payload.resolved_at = now;

  const { error } = await sb.from(type).upsert(payload);
  if(error){
    alert(error.message);
    return;
  }
  closeModal();
  await loadData();
}

async function deleteEntity(){
  const type = document.getElementById("entityType").value;
  const id = document.getElementById("entityId").value;
  if(!id) return;
  if(!confirm("Delete this record?")) return;
  const { error } = await sb.from(type).delete().eq("id", id);
  if(error){
    alert(error.message);
    return;
  }
  closeModal();
  await loadData();
}

document.getElementById("modal").addEventListener("click", e => {
  if(e.target.id === "modal") closeModal();
});
